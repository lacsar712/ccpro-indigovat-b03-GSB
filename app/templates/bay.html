{% extends "base.html" %}
{% block title %}染缸还原台{% endblock %}
{% block content %}
<div
  x-data="vatBay()"
  x-init="init()"
>
  <div class="chips" role="toolbar" aria-label="工坊筛选">
    <button type="button" class="chip" :class="{ on: filterWs === null }" @click="setFilter(null)">全部缸位</button>
    <template x-for="w in workshops" :key="w.id">
      <button
        type="button"
        class="chip"
        :class="{ on: filterWs === w.id }"
        @click="setFilter(w.id)"
        x-text="w.name"
      ></button>
    </template>
  </div>

  <div class="chips status-chips" role="toolbar" aria-label="状态筛选">
    <button
      type="button"
      class="chip"
      :class="{ on: filterStatus === null }"
      @click="setStatusFilter(null)"
    >全部状态 <span class="chip-count" x-text="countAll()"></span></button>
    <button
      type="button"
      class="chip st-chip-idle"
      :class="{ on: filterStatus === 'idle' }"
      @click="setStatusFilter('idle')"
    >闲置 <span class="chip-count" x-text="countFor('idle')"></span></button>
    <button
      type="button"
      class="chip st-chip-reducing"
      :class="{ on: filterStatus === 'reducing' }"
      @click="setStatusFilter('reducing')"
    >还原中 <span class="chip-count" x-text="countFor('reducing')"></span></button>
    <button
      type="button"
      class="chip st-chip-ready"
      :class="{ on: filterStatus === 'ready' }"
      @click="setStatusFilter('ready')"
    >可染色 <span class="chip-count" x-text="countFor('ready')"></span></button>
  </div>

  {% if error %}
  <div class="error-box">{{ error }}</div>
  {% endif %}

  <div class="bay-scroll" role="list">
    <template x-for="v in filteredVats()" :key="v.id">
      <button
        type="button"
        class="vat-card"
        :class="['st-' + v.status, { selected: selectedId === v.id }]"
        role="listitem"
        @click="toggle(v.id)"
      >
        <div class="code" x-text="v.code"></div>
        <div class="meta" x-text="v.workshopName + ' · ' + v.dyeType"></div>
        <div class="status-label">
          <span class="status-dot"></span>
          <span x-text="v.statusLabel"></span>
        </div>
        <svg class="spark" width="72" height="28" viewBox="0 0 72 28" aria-hidden="true">
          <polyline
            x-show="v.spark.length"
            fill="none"
            stroke="#9fd4c8"
            stroke-width="1.6"
            stroke-linejoin="round"
            stroke-linecap="round"
            :points="v.spark.map(p => p.x + ',' + p.y).join(' ')"
          ></polyline>
          <line
            x-show="!v.spark.length"
            x1="4" y1="14" x2="68" y2="14"
            stroke="rgba(216,235,232,0.35)"
            stroke-width="1"
            stroke-dasharray="3 3"
          ></line>
        </svg>
        <div class="mv" :class="{ empty: v.lastRedox === null }">
          <template x-if="v.lastRedox !== null">
            <span x-text="v.lastRedox + ' mV'"></span>
          </template>
          <template x-if="v.lastRedox === null">
            <span>尚无电位</span>
          </template>
        </div>
      </button>
    </template>
  </div>
  <p class="empty-bay" x-show="filteredVats().length === 0" x-cloak>此筛选条件下暂无染缸。</p>

  <div class="panel" x-show="selected()" x-cloak x-transition>
    <template x-if="selected()">
      <div>
        <h2>
          <span x-text="selected().code"></span>
          <span style="font-weight:500;font-size:0.9rem;color:#4a6670;margin-left:0.4rem"
                x-text="selected().workshopName + ' · ' + selected().volumeL + ' L'"></span>
        </h2>
        <p class="hint">当前状态字段为 <strong x-text="selected().statusLabel"></strong>
          · 最近浸染 <span x-text="selected().lastDippedAt || '—'"></span></p>

        <div class="gate" :class="selected().potentialReady ? 'gate-yes' : 'gate-no'">
          <div class="gate-line">
            <span class="gate-tag">达标条文</span>
            <strong x-text="selected().potentialReady ? '是 · 电位达标' : '否 · 电位未达标'"></strong>
            <span class="gate-threshold">门槛：最新批次电位 ≤ -500 mV</span>
          </div>
          <p class="gate-reason" x-text="selected().readyGateReason"></p>
          <p class="gate-note">
            条文只按<strong>最新批次读数</strong>派生，与改状态入口同一口径；它不是状态字段。
            当前缸状态字段仍是「<span x-text="selected().statusLabel"></span>」——
            条文亮「是」不会自动改写状态，写入合格读数也不会静默改写状态；只有在下方手动改状态成功后才会变。
          </p>
        </div>

        <div class="panel-grid">
          <div>
            <h3 style="font-size:1rem;margin:0 0 0.65rem;color:#1f4d6b">登记浸染</h3>
            <form method="post" :action="'/bay/vats/' + selected().id + '/lots'">
              <input type="hidden" name="workshop" :value="filterWs || ''">
              <input type="hidden" name="status_filter" :value="filterStatus || ''">
              <label>浸染时间
                <input type="datetime-local" name="dippedAt" required :value="nowLocal()">
              </label>
              <label>布料米数
                <input type="number" name="clothMeters" step="0.01" min="0.01" required placeholder="例如 24.5">
              </label>
              <label>氧化还原电位 (mV，可空)
                <input type="number" name="redoxMv" step="0.01" placeholder="例如 -520">
              </label>
              <button type="submit">写入本缸</button>
            </form>
          </div>
          <div>
            <h3 style="font-size:1rem;margin:0 0 0.65rem;color:#1f4d6b">改缸状态</h3>
            <form method="post" :action="'/bay/vats/' + selected().id + '/status'">
              <input type="hidden" name="workshop" :value="filterWs || ''">
              <input type="hidden" name="status_filter" :value="filterStatus || ''">
              <label>目标状态
                <select name="status" required :value="selected().status">
                  <option value="idle">闲置</option>
                  <option value="reducing">还原中</option>
                  <option value="ready">可染色</option>
                </select>
              </label>
              <button type="submit">更新状态</button>
            </form>
            <h3 style="font-size:0.95rem;margin:1.25rem 0 0.4rem;color:#1f4d6b">近几笔浸染</h3>
            <ul class="lot-list">
              <template x-for="l in selected().recentLots" :key="l.id">
                <li>
                  <span x-text="l.dippedAt"></span>
                  <span>
                    <span x-text="l.clothMeters + ' m'"></span>
                    ·
                    <span x-text="l.redoxMv === null ? '无电位' : (l.redoxMv + ' mV')"></span>
                  </span>
                </li>
              </template>
              <li x-show="!selected().recentLots.length" style="border:0;color:#6b7c85">尚无记录</li>
            </ul>
          </div>
        </div>
      </div>
    </template>
  </div>

  <p class="rule-foot">工坊、状态只作缸位筛选片；浸染与状态均在缸位展开区内完成，无独立表页。可染色张数与状态筛选只认状态字段已为「可染色」的缸。</p>
</div>

<script>
  function vatBay() {
    return {
      workshops: {{ workshops | tojson }},
      vats: {{ vats | tojson }},
      filterWs: {{ filter_workshop if filter_workshop is not none else 'null' }},
      filterStatus: {{ filter_status | tojson }},
      selectedId: {{ selected_vat if selected_vat is not none else 'null' }},
      init() {
        const params = new URLSearchParams(window.location.search);
        if (params.has('workshop') && this.filterWs === null) {
          const w = parseInt(params.get('workshop'), 10);
          if (!isNaN(w)) this.filterWs = w;
        }
        if (params.has('status') && this.filterStatus === null) {
          const s = params.get('status');
          if (['idle', 'reducing', 'ready'].includes(s)) this.filterStatus = s;
        }
        if (params.has('vat') && this.selectedId === null) {
          const v = parseInt(params.get('vat'), 10);
          if (!isNaN(v)) this.selectedId = v;
        }
      },
      // 唯一筛选口径：工坊 + 状态。状态判定只比对持久化的 v.status 字段，
      // 绝不使用读数派生的 potentialReady —— 条文亮灯但状态仍「还原中」的缸不计入。
      matchesStatus(v, s) {
        return s === null || v.status === s;
      },
      wsScoped() {
        return this.filterWs === null
          ? this.vats
          : this.vats.filter(v => v.workshopId === this.filterWs);
      },
      filteredVats() {
        const scope = this.wsScoped();
        return this.filterStatus === null
          ? scope
          : scope.filter(v => this.matchesStatus(v, this.filterStatus));
      },
      // 图例张数与可见集共用同一谓词，按状态字段计数。
      countAll() {
        return this.wsScoped().length;
      },
      countFor(s) {
        return this.wsScoped().filter(v => this.matchesStatus(v, s)).length;
      },
      syncUrl() {
        const url = new URL(window.location.href);
        if (this.filterWs === null) url.searchParams.delete('workshop');
        else url.searchParams.set('workshop', this.filterWs);
        if (this.filterStatus === null) url.searchParams.delete('status');
        else url.searchParams.set('status', this.filterStatus);
        if (this.selectedId) url.searchParams.set('vat', this.selectedId);
        else url.searchParams.delete('vat');
        history.replaceState(null, '', url.pathname + url.search);
      },
      pruneSelection() {
        const still = this.filteredVats().some(v => v.id === this.selectedId);
        if (!still) this.selectedId = null;
      },
      setFilter(id) {
        this.filterWs = id;
        this.pruneSelection();
        this.syncUrl();
      },
      setStatusFilter(s) {
        this.filterStatus = s;
        this.pruneSelection();
        this.syncUrl();
      },
      toggle(id) {
        this.selectedId = this.selectedId === id ? null : id;
        this.syncUrl();
      },
      selected() {
        return this.vats.find(v => v.id === this.selectedId) || null;
      },
      nowLocal() {
        const d = new Date();
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 16);
      },
    };
  }
</script>
{% endblock %}
